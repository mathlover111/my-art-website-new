<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>糰子牛奶的作品集</title>

<!-- 引入現代美觀字體 Noto Sans TC -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  background-image: url('background.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align: center;
  color: #fff; /* 改為白色高對比文字 */
  margin: 0;
  padding: 0;
}

/* 側邊欄切換按鈕 */
.sidebar-toggle-btn {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1001;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 1px;
  transition: 0.3s;
}

.sidebar-toggle-btn:hover {
  background: rgba(9, 115, 214, 0.8);
}

/* 側邊欄（移除頭像） */
.sidebar {
  position: fixed;
  top: 0;
  left: -280px;
  width: 260px;
  height: 100%;
  background: rgba(15, 15, 15, 0.8);
  backdrop-filter: blur(12px);
  box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
  z-index: 1000;
  transition: left 0.3s ease;
  padding: 80px 20px 20px 20px;
  box-sizing: border-box;
  color: #fff;
  text-align: center;
}

.sidebar.active {
  left: 0;
}

.sidebar h3 {
  font-size: 20px;
  font-weight: 800;
  color: #4bacff;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.bio {
  font-size: 14px;
  color: #ddd;
  line-height: 1.8;
  font-weight: 400;
}

h1 {
  padding-top: 50px;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(9, 115, 214, 0.6);
}

/* 管理員面板 */
#adminPanel {
  display: none;
  margin: 20px auto;
  padding: 20px;
  width: 90%;
  max-width: 600px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  color: #fff;
}

#adminPanel h3 {
  margin-top: 0;
  font-size: 18px;
  color: #4bacff;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin: 30px 0;
}

.img-item {
  margin: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gallery img {
  width: 220px;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.5);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}

.gallery img:hover {
  transform: translateY(-5px) scale(1.03);
  box-shadow: 0 12px 24px rgba(0,0,0,0.7);
}

/* 圖片下方讚數按鈕 */
.image-like-btn {
  margin-top: 10px;
  background: rgba(255, 255, 255, 0.9);
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  color: #e74c3c;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.2s, background 0.2s;
}

.image-like-btn:hover {
  transform: scale(1.1);
  background: #ffffff;
}

#imageModal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  justify-content: center;
  align-items: center;
  cursor: zoom-out;
}

#modalImg {
  max-width: 90%;
  max-height: 90%;
  border-radius: 8px;
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
  animation: zoomIn 0.3s;
}

@keyframes zoomIn {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.del-img-btn {
  display: none;
  margin-top: 8px;
  background: #ff4d4d;
  color: white;
  border: none;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}

.comment-box { 
  margin: 40px auto 100px; 
  width: 90%; 
  max-width: 800px; 
}

.comment-box h2 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

textarea { 
  width: 100%; 
  height: 90px; 
  border-radius: 8px; 
  padding: 12px; 
  box-sizing: border-box; 
  font-family: inherit; 
  font-size: 14px;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255, 255, 255, 0.95);
  outline: none;
}

/* 按鈕美化 */
button {
  font-family: inherit;
  font-weight: 600;
}

#submitCommentBtn, .comment-box button {
  padding: 8px 22px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}

#commentList {
  margin: 20px auto;
  width: 100%;
  max-width: 600px;
  background: rgba(255, 255, 255, 0.95);
  padding: 12px;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  text-align: left;
}

#commentList p { 
  background: #f8f9fa; 
  padding: 10px; 
  margin: 6px 0; 
  border-radius: 6px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  font-size: 14px;
  color: #222; 
}

.delete-btn { background: #ff4444; color: white; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; margin-left: 5px; }
</style>
</head>

<body>

<!-- 側邊欄開關按鈕 -->
<button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰ 作者簡介</button>

<!-- 無頭像側邊欄 -->
<div class="sidebar" id="sidebar">
  <h3>糰子牛奶</h3>
  <p class="bio">歡迎來到我的插畫作品集！<br>喜歡動漫手繪與電繪創作 ✨</p>
</div>

<h1>糰子牛奶的畫畫作品 🎨</h1>

<div id="imageModal" onclick="this.style.display='none'">
  <img id="modalImg" src="">
</div>

<div id="adminPanel">
  <h3>管理員控制台 (上限 10 張)</h3>
  <input type="text" id="imgUrlInput" placeholder="貼上圖片原始連結" style="width:70%; padding:6px; border-radius:4px; border:none;">
  <button id="addImageBtn" onclick="addImage()" style="padding:6px 12px;">新增圖片</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="comment-box">
  <h2>留言區</h2>
  <textarea id="commentInput" placeholder="來都來了，寫點評論吧😉"></textarea>
  <br><br>
  <button id="submitCommentBtn" onclick="addComment()" style="background:#0973d6; color:white;">送出</button>
  <button onclick="login()" style="background:#444; color:white; margin-left: 10px;">Google 登入</button>
  <div id="commentList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCstAO_LlkU9hm1L2-1R1k8KpvPcnDuULI",
  authDomain: "myprogram-476fd.firebaseapp.com",
  databaseURL: "https://myprogram-476fd-default-rtdb.firebaseio.com",
  projectId: "myprogram-476fd",
  storageBucket: "myprogram-476fd.appspot.com",
  messagingSenderId: "292155592104",
  appId: "1:292155592104:web:45788da74aa7986b56e19d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let currentUser = null;
const adminID = "PrQ5SswIOBWWRCAFU6pz8mTpVjp1";

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("active");
}

firebase.auth().onAuthStateChanged(user => {
  if (user) {
    currentUser = user.uid;
    if(currentUser === adminID) {
      document.getElementById('adminPanel').style.display = 'block';
    }
  } else {
    currentUser = null;
    document.getElementById('adminPanel').style.display = 'none';
  }
  document.getElementById("commentList").innerHTML = "";
  loadComments();
});

function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(err => alert("登入失敗: " + err.message));
}

function loadImages(){
  db.ref("images").on("value", snap => {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    snap.forEach(child => {
      const url = child.val();
      const id = child.key;
      const div = document.createElement("div");
      div.className = "img-item";
      
      const img = document.createElement("img");
      img.src = url;
      
      img.onclick = () => {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        modal.style.display = "flex";
        modalImg.src = url;
      };

      const likeBtn = document.createElement("button");
      likeBtn.className = "image-like-btn";
      likeBtn.innerHTML = `❤️ <span id="like-${id}">0</span>`;
      likeBtn.onclick = (e) => {
        e.stopPropagation();
        db.ref("likes/" + id).transaction(count => (count || 0) + 1);
      };

      db.ref("likes/" + id).on("value", likeSnap => {
        const countSpan = document.getElementById(`like-${id}`);
        if(countSpan) countSpan.textContent = likeSnap.val() || 0;
      });

      const delBtn = document.createElement("button");
      delBtn.className = "del-img-btn";
      delBtn.textContent = "刪除圖片";
      if(currentUser === adminID) delBtn.style.display = "block";
      delBtn.onclick = (e) => { 
        e.stopPropagation();
        if(confirm("確定刪除？")) {
          db.ref("images/" + id).remove(); 
          db.ref("likes/" + id).remove(); 
        }
      };

      div.appendChild(img);
      div.appendChild(likeBtn);
      div.appendChild(delBtn);
      gallery.appendChild(div);
    });
  });
}

function addImage(){
  const input = document.getElementById("imgUrlInput");
  const btn = document.getElementById("addImageBtn");
  const url = input.value.trim();
  if(!url || currentUser !== adminID) return;
  
  btn.disabled = true;
  db.ref("images").once("value", snap => {
    if(snap.numChildren() >= 10) {
      btn.disabled = false;
      return alert("已達 10 張上限");
    }
    db.ref("images").push(url).then(() => { 
      input.value = ""; 
      alert("新增成功"); 
      btn.disabled = false;
    }).catch(err => {
      alert("新增失敗: " + err.message);
      btn.disabled = false;
    });
  });
}

function loadComments(){
  const list = document.getElementById("commentList");
  db.ref("comments").on("child_added", snap => {
    const data = snap.val();
    const id = snap.key;
    if(document.getElementById("msg-" + id)) return;
    
    const p = document.createElement("p");
    p.id = "msg-" + id;
    
    const date = new Date(data.time);
    const timeText = (date.getMonth()+1)+"/"+date.getDate()+" "+date.getHours()+":"+(date.getMinutes()<10?'0':'')+date.getMinutes();
    
    const contentSpan = document.createElement("span");
    const nameNode = document.createElement("b");
    nameNode.textContent = data.name || "匿名使用者";
    const textNode = document.createTextNode(`: ${data.text} `);
    const timeNode = document.createElement("small");
    timeNode.style.color = "#777";
    timeNode.textContent = ` (${timeText})`;
    
    contentSpan.appendChild(nameNode);
    contentSpan.appendChild(textNode);
    contentSpan.appendChild(timeNode);
    p.appendChild(contentSpan);
    
    if(data.user === currentUser || currentUser === adminID){
      const btn = document.createElement("button");
      btn.textContent = "刪除";
      btn.className = "delete-btn";
      btn.onclick = () => db.ref("comments/"+id).remove();
      p.appendChild(btn);
    }
    list.appendChild(p);
  });
  
  db.ref("comments").on("child_removed", snap => {
    const element = document.getElementById("msg-" + snap.key);
    if(element) element.remove();
  });
}

function addComment(){
  if(!currentUser) return alert("請先登入！");
  const input = document.getElementById("commentInput");
  const btn = document.getElementById("submitCommentBtn");
  const text = input.value.trim();
  if(!text) return;
  
  btn.disabled = true;
  db.ref("comments").push({
    text: text,
    user: currentUser,
    name: firebase.auth().currentUser.displayName || "Genshin Player",
    time: Date.now()
  }).then(() => {
    input.value = "";
    setTimeout(() => { btn.disabled = false; }, 1500); 
  }).catch(err => {
    alert("留言失敗: " + err.message);
    btn.disabled = false;
  });
}

loadImages();
</script>
</body>
</html>
